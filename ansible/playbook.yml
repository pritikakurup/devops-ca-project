---
- name: Configure DevOps application runtime
  hosts: local
  become: false

  tasks:
    - name: Install required Python package
      ansible.builtin.pip:
        name: flask
        state: present

    - name: Create application configuration file
      ansible.builtin.copy:
        content: |
          APP_NAME=DevOps-CA-Project
          ENVIRONMENT=lab
        dest: /tmp/devops-ca-config.txt
        mode: "0644"

    - name: Create application marker directory
      ansible.builtin.file:
        path: /tmp/devops-ca
        state: directory
        mode: "0755"
